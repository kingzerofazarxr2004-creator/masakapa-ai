<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Resep - MasakApa.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-orange-50 min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="flex items-center justify-between mb-8">
            <a href="/dashboard.html"
                class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-slate-600 hover:text-orange-500 transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- TOMBOL SIMPAN KE FIRESTORE -->
            <button id="btn-simpan-favorit"
                class="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-semibold text-orange-500 hover:bg-orange-50 border border-orange-100 transition-all btn-shine">
                <i class="fa-regular fa-bookmark mr-1"></i> Simpan Favorit
            </button>

        </div>

        <div class="bg-white rounded-3xl shadow-lg overflow-hidden border border-slate-100 mb-6">
            <div class="bg-gradient-to-r from-orange-400 to-red-500 p-8 text-center">
                <div
                    class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner no-select">
                    🍲</div>
                <h1 class="text-2xl md:text-3xl font-bold text-white mb-2" id="judul-resep">Menyiapkan Resep...</h1>
                <div class="flex justify-center gap-4 text-white/90 text-sm font-medium">
                    <span><i class="fa-solid fa-fire-burner mr-1"></i> Mode Hemat</span>
                </div>
            </div>

            <!-- KONTEN RESEP -->
            <div class="p-6 md:p-8 text-slate-700 leading-relaxed space-y-4" id="resep-content">
                <div id="isi-resep">
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-6 py-1">
                            <div class="h-3 bg-slate-200 rounded skeleton-box"></div>
                            <div class="space-y-3">
                                <div class="grid grid-cols-3 gap-4">
                                    <div class="h-3 bg-slate-200 rounded col-span-2 skeleton-box"></div>
                                    <div class="h-3 bg-slate-200 rounded col-span-1 skeleton-box"></div>
                                </div>
                                <div class="h-3 bg-slate-200 rounded skeleton-box"></div>
                                <div class="h-3 bg-slate-200 rounded w-5/6 skeleton-box"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TOMBOL SHARE WHATSAPP -->
        <button id="btn-share-wa"
            class="w-full bg-[#25D366] text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-[#1ebd5a] transition-all flex justify-center items-center gap-2 mb-6 btn-shine">
            <i class="fa-brands fa-whatsapp text-xl"></i> Pamerkan Resep ke WA
        </button>

        <div class="text-center pb-8">
            <a href="/dashboard.html"
                class="text-slate-500 font-medium hover:text-orange-500 underline underline-offset-4">Masak menu yang
                lain?</a>
        </div>
    </div>

    <!-- UPDATE VERSI SCRIPT -->
    <script src="/js/resep.js?v=23"></script>
</body>

</html>
