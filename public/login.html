<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MasakApa.ai</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/logo.png">
    <!-- Framework & Ikon -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS Kustom Kita -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-orange-50 to-red-50 min-h-screen flex items-center justify-center p-4">

    <div
        class="bg-white p-8 md:p-10 rounded-3xl shadow-xl max-w-md w-full text-center transform transition-all hover:scale-[1.01] glass-effect">
        <div class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fa-solid fa-lock text-3xl text-orange-500"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Selamat Datang Koki!</h2>
        <p class="text-slate-500 mb-8 text-sm">Masuk untuk menyimpan resep dan menggunakan AI kulkas pintar.</p>

        <button id="btn-login"
            class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 text-slate-700 font-semibold py-3 px-4 rounded-xl hover:bg-slate-50 hover:border-orange-400 transition-all shadow-sm active:scale-95">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6" alt="Google">
            Lanjutkan dengan Google
        </button>
        <p class="mt-6 text-xs text-slate-400">Dengan masuk, kamu menyetujui resep anti-lapar kami.</p>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>

</html>
